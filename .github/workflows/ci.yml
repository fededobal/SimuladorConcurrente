# Integracion continua: corre en cada push y en cada PR.
# Tres chequeos independientes; si uno falla, GitHub muestra cual y por que.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nucleo:
    name: Núcleo Java (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -q test

  motor:
    name: Motor JS al día con el núcleo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Barato: compara la huella del nucleo con la guardada al regenerar el motor.
      - run: node scripts/motor-hash.mjs --check
      # Prueba el motor COMPILADO que se publica, no el Java.
      - run: node scripts/smoke-motor.mjs

  frontend:
    name: Frontend (lint + tipos + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
