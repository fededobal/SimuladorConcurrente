# En un deploy el host inyecta PORT; en local queda 8080.
server.port=${PORT:8080}
spring.application.name=simulador-monitores

# Limpieza de simulaciones inactivas
simulador.session.ttl-minutes=60
simulador.session.max-active=200

# CORS: por defecto el frontend Vite en desarrollo. En un deploy se sobreescribe con la
# variable de entorno CORS_ORIGINS (admite comodines, p. ej. https://*.vercel.app).
simulador.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
