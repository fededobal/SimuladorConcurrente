# Deploy del backend en Render (https://render.com). El frontend va aparte en Vercel.
# CORS_ORIGINS tiene que incluir el dominio de Vercel; se setea en el dashboard.
services:
  - type: web
    name: simulador-monitores-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: CORS_ORIGINS
        sync: false
